name: PR Receipts
description: "Sticky PR comment with what an agent-written PR cost: tokens, list-price dollars and agent time, from git notes."
author: Agnij Dutta
branding:
  icon: file-text
  color: green

inputs:
  github-token:
    description: Token used to list, create and update PR comments. Needs `pull-requests: write`. Not used in dry-run.
    default: ${{ github.token }}
  notes-ref:
    description: Git notes ref holding receipts (without the refs/notes/ prefix).
    default: pr-receipts
  dry-run:
    description: Render the comment into the job log and step summary without calling the GitHub API.
    default: "false"
  on-missing:
    description: What to do when no receipt is attached. `skip` (default) or `comment` (posts a short "no receipt yet" note).
    default: skip

outputs:
  cost-usd:
    description: Total cost from the receipt, if one was found.
  headline:
    description: One-line receipt headline, if one was found.

runs:
  using: composite
  steps:
    - name: Fetch receipt notes
      shell: bash
      env:
        NOTES_REF: ${{ inputs.notes-ref }}
      # ls-remote --exit-code returns 2 only when the ref is absent. Any other
      # failure (auth, network) fails the step instead of looking like "no receipt".
      run: |
        set +e
        git ls-remote --exit-code origin "refs/notes/${NOTES_REF}" > /dev/null
        status=$?
        set -e
        if [ "$status" -eq 2 ]; then
          echo "pr-receipts: no refs/notes/${NOTES_REF} on origin yet"
        elif [ "$status" -ne 0 ]; then
          echo "::error::pr-receipts: git ls-remote origin failed (exit $status)"
          exit "$status"
        else
          git fetch --no-tags origin "+refs/notes/${NOTES_REF}:refs/notes/${NOTES_REF}"
        fi
    - name: Upsert sticky comment
      id: comment
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_NOTES_REF: ${{ inputs.notes-ref }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_ON_MISSING: ${{ inputs.on-missing }}
      run: node "${GITHUB_ACTION_PATH}/dist/src/action/main.js"
